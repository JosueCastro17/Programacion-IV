<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie/dist/dexie.js"></script>
    <script src="js/db.js"></script>
</head>
<body>
    <div id="app" class="container mt-5">
        <h2>Administrar Libros</h2>

        <form @submit.prevent="agregarLibro">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" class="form-control" v-model="nuevoLibro.titulo">
            </div>
            <div class="mb-3">
                <label class="form-label">ISBN:</label>
                <input type="text" class="form-control" v-model="nuevoLibro.isbn">
            </div>
            <div class="mb-3">
                <label class="form-label">Editorial:</label>
                <input type="text" class="form-control" v-model="nuevoLibro.editorial">
            </div>
            <button class="btn btn-primary">Guardar</button>
        </form>

        <h3 class="mt-4">Lista de Libros</h3>
        <ul class="list-group">
            <li v-for="libro in libros" :key="libro.idLibro" class="list-group-item">
                {{ libro.titulo }} - ISBN: {{ libro.isbn }} - {{ libro.editorial }}
                <button class="btn btn-danger btn-sm float-end" @click="eliminarLibro(libro.idLibro)">Eliminar</button>
            </li>
        </ul>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    nuevoLibro: { titulo: "", isbn: "", editorial: "" },
                    libros: []
                };
            },
            methods: {
                async agregarLibro() {
                    await db.libros.add({ ...this.nuevoLibro });
                    this.nuevoLibro = { titulo: "", isbn: "", editorial: "" };
                    await this.cargarLibros();  // 🚀 Aseguramos que la lista se actualice
                },
                async cargarLibros() {
                    this.libros = await db.libros.toArray();
                },
                async eliminarLibro(id) {
                    await db.libros.delete(id);
                    await this.cargarLibros();  // 🚀 Recargamos la lista después de eliminar
                }
            },
            async mounted() {
                await this.cargarLibros();  // 🚀 Cargamos los libros al iniciar la página
            }
        }).mount("#app");
    </script>
</body>
</html>
