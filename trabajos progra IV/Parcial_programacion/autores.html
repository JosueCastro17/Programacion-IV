<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie/dist/dexie.js"></script>
    <script src="js/db.js"></script>
</head>
<body>
    <div id="app" class="container mt-5">
        <h2>Administrar Autores</h2>

        <form @submit.prevent="agregarAutor">
            <div class="mb-3">
                <label class="form-label">Código:</label>
                <input type="text" class="form-control" v-model="nuevoAutor.codigo">
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" class="form-control" v-model="nuevoAutor.nombre">
            </div>
            <div class="mb-3">
                <label class="form-label">País:</label>
                <input type="text" class="form-control" v-model="nuevoAutor.pais">
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono:</label>
                <input type="text" class="form-control" v-model="nuevoAutor.telefono">
            </div>
            <button class="btn btn-primary">Guardar</button>
        </form>

        <h3 class="mt-4">Lista de Autores</h3>
        <ul class="list-group">
            <li v-for="autor in autores" class="list-group-item">
                {{ autor.codigo }} - {{ autor.nombre }} ({{ autor.pais }})
                <button class="btn btn-danger btn-sm float-end" @click="eliminarAutor(autor.idAutor)">Eliminar</button>
            </li>
        </ul>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    nuevoAutor: { codigo: "", nombre: "", pais: "", telefono: "" },
                    autores: []
                };
            },
            methods: {
                async agregarAutor() {
                    await db.autores.add({ ...this.nuevoAutor });
                    this.nuevoAutor = { codigo: "", nombre: "", pais: "", telefono: "" };
                    this.cargarAutores();
                },
                async cargarAutores() {
                    this.autores = await db.autores.toArray();
                },
                async eliminarAutor(id) {
                    await db.autores.delete(id);
                    this.cargarAutores();
                }
            },
            mounted() {
                this.cargarAutores();
            }
        }).mount("#app");
    </script>
</body>
</html>
