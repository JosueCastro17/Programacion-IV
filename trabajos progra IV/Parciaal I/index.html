<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera aplicacion con HTML + CSS + JS</title>
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
    <!-- Semantic UI theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
    <!-- Bootstrap theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div id="app" ref="app">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img width="150" src="img/logo.png" alt="Logo UGB">
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarText">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" @click="abrirFormulario('libro')" href="#">libro</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" @click="abrirFormulario('autor')" href="#">autor</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" @click="abrirFormulario('libroAutor')" href="#">Libro Autor</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" @click="abrirFormulario('usuario')" href="#">Usuario</a>
                            </li>
                         
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        <div class="container-fluid" id="appSistema">
            <libro v-show="forms.libro.mostrar" :forms="forms" ref="libro" @buscar="buscar('buscarlibro', 'listarlibros')"></libro>
            <buscarlibro v-show="forms.buscarlibro.mostrar" ref="buscarlibro" @modificar="modificar('libro', 'modificarlibro', $event)"></buscarlibro>
            <autor v-show="forms.autor.mostrar" :forms="forms" ref="autor" @buscar="buscar('buscarautor', 'listarautors')"></autor>
            <buscarautor v-show="forms.buscarautor.mostrar" ref="buscarautor" @modificar="modificar('autor', 'modificarautor', $event)"></buscarautor>
            <usuario v-show="forms.usuario.mostrar" :forms="forms" ref="usuario" @buscar="buscar('buscarusuario', 'listarUsuarios')"></usuario>
            <buscarusuario v-show="forms.buscarUsuario.mostrar" ref="buscarusuario" @modificar="modificar('usuario', 'modificarUsuario', $event)"></buscarusuario>
            <libroAutor v-show="forms.libroAutor.mostrar" :forms="forms"></libroAutor>
            <login v-show="forms.login.mostrar"></login>

        </div>
    </div>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="componentes/busqueda_libros.js"></script>
    <script src="componentes/libros.js"></script>
    <script src="componentes/busqueda_autors.js"></script>
    <script src="componentes/autores.js"></script>
    <script src="componentes/busqueda_usuarios.js"></script>
    <script src="componentes/usuarios.js"></script>
    <script src="componentes/login.js"></script>
    <script src="main.js"></script>
    <script src="componentes/libro_autor.js"></script>

</body>

</html>
